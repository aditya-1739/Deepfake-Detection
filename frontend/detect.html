<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepFake Detection</title>
    <link rel="stylesheet" href="detect.css">
    <script src="detect.js" defer></script>
</head>
<body>
    <header>
        <h1>DeepFake Detection System</h1>
        <button id="logoutBtn">Logout</button> <!-- Logout Button -->
    </header>

    <main>
        <section class="upload-section">
            <h2>Upload a Video for Analysis</h2>
            <input type="file" id="videoUpload" accept="video/*">
            <button id="analyzeBtn">Analyze</button>
        </section>

        <section class="result-section">
            <h2>Analysis Results</h2>
            <div id="result-container">
                <p>No analysis yet. Upload a video and click "Analyze".</p>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 DeepFake Detection System</p>
    </footer>
</body>
</html>
