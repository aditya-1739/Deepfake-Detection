<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | DeepFake Detection</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="container">
        <!-- Login Form -->
        <div class="form-container" id="login-form">
            <h2>Login</h2>
            <form id="loginForm">
                <input type="email" id="login-email" placeholder="Email" required>
                <input type="password" id="login-password" placeholder="Password" required>
                <p id="login-error" style="color: red; font-size: 0.9em; margin-top: 5px; display: none;"></p>
                <button type="submit">Login</button>
                <p>Don't have an account? <a href="#" id="show-signup">Sign Up</a></p>
            </form>
        </div>

        <!-- Sign-Up Form -->
        <div id="signup-form" style="display: none;">
    <h2>Sign Up</h2>
    <form id="signupForm">
        <input type="email" id="signup-email" placeholder="Enter your email" required>
        <input type="password" id="signup-password" placeholder="Enter your password" required>
        <button type="submit">Sign Up</button>
    </form>
    <p id="signup-error" style="color: red; display: none;"></p>
    <p id="signup-success" style="color: green; display: none;"></p>
    <p>Already have an account? <a href="#" id="show-login">Log in</a></p>
</div>

    </div>

    <script src="login.js"></script>
</body>
</html>
